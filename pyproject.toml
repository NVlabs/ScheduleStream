[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schedulestream"
authors = [
  {name = "Caelan Garrett"},
]
description = "Temporal planning with samplers for multi-arm task and motion planning (TAMP)"
keywords = ["planning", "scheduling", "robotics", "task and motion planning"]
classifiers = [
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version", "readme"]
license = {file = "LICENSE"}
requires-python = ">=3.10"

dependencies = [
  "pyyaml",
]

[project.urls]
Homepage = "https://schedulestream.github.io/"
Paper = "https://arxiv.org/abs/2511.04758"
Repository = "https://github.com/NVlabs/ScheduleStream"

[project.optional-dependencies]
test = ["pytest"]

dev = [
  "ipdb",
  "ipython",
  "pygraphviz",
  "pillow",
]

trimesh2d = [
  "numpy",
  "scipy",
  "trimesh",
  "python-fcl",
  "pyglet<2",
  "pillow",
  "imageio[ffmpeg]",
]

custream = ["schedulestream[trimesh2d]", "structlog", "packaging", "yourdfpy"]

# cuStream2: cuRoboV2 (pinned source commit) and a CUDA-matched torch. The torch CUDA wheel
# index must be passed explicitly (pip does not read uv's index config):
#
#   CUDA 13.x: pip install -e ".[custream2]" --extra-index-url https://download.pytorch.org/whl/cu130
#   CUDA 12.x: pip install -e ".[custream2-cu12]" --extra-index-url https://download.pytorch.org/whl/cu128
custream2-base = [
  "numpy",
  "trimesh",
  "scipy",
  "matplotlib",
  "packaging",
  "huggingface-hub",
  "structlog",
  "pyglet<2",
  "python-fcl",
  "fast_simplification",
]

custream2 = [
  "schedulestream[custream2-base]",
  "torch>=2.9",
  "nvidia-curobo[cu13] @ git+https://github.com/NVlabs/curobo@78fd485fa82d9b9a063fb4985e371814587e666a",
]

custream2-cu12 = [
  "schedulestream[custream2-base]",
  "torch>=2.5",
  "nvidia-curobo[cu12] @ git+https://github.com/NVlabs/curobo@78fd485fa82d9b9a063fb4985e371814587e666a",
]

isaaclab = ["schedulestream[custream]", "warp-lang==1.9.0"]

cumotion = ["trimesh", "pyglet<2", "structlog"]

[tool.setuptools]
platforms = ["any"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

# See the `setuptools_scm` documentation for the description of the schemes used below.
# https://pypi.org/project/setuptools-scm/
# NOTE: The `fallback_version` is necessary to prevent an error when attempting to install the
# project locally and the project is not in a valid git repo or when git is not installed or
# functioning correctly.
[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "dirty-tag"
fallback_version = "0.0.0.dev0"

[tool.black]
line-length = 100
extend-exclude = "deprecated/"
preview = true

[tool.isort]
# Multi line output mode 3 is used to conform with Black. See
# https://github.com/PyCQA/isort#multi-line-output-modes
multi_line_output = 3
profile = "black"
import_heading_stdlib = "Standard Library"
import_heading_thirdparty = "Third Party"
import_heading_firstparty = "NVIDIA"
known_first_party = ["nvidia"]
import_heading_localfolder = "Local Folder"
line_length = 100
skip_glob = ["deprecated/*", "wip/*"]
